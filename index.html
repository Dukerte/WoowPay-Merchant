<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woow Pay – Мерчант</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #29BDE0;
      --primary-dark: #1A9CBD;
      --accent: #5CD4EE;
      --accent-soft: #A8E9F7;
      --dark: #060C24;
      --dark-2: #0A1840;
      --text: #0F1C3F;
      --muted: #5A7A8A;
      --soft: #EBF8FC;
      --soft-2: #F5FBFE;
      --line: #C4E8F5;
      --card: #FFFFFF;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
      --radius: 18px;
      --shadow: 0 20px 70px rgba(6, 12, 36, .40);
      --shadow-soft: 0 8px 28px rgba(41, 189, 224, .10);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(41,189,224,.22), transparent 36%),
        radial-gradient(circle at 82% 0%, rgba(92,212,238,.12), transparent 30%),
        linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 52%, var(--dark) 100%);
    }

    a { color: inherit; }

    h1, h2, h3, .btn-primary, .btn-secondary, .mini-cta, .header-badge, .stat-card strong {
      font-family: 'Manrope', 'Noto Sans', system-ui, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6,12,36,.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.10);
      padding: 0 1.25rem;
    }

    .header-inner {
      max-width: 1160px;
      height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo { display: flex; align-items: center; text-decoration: none; }

    .logo-wordmark {
      height: 38px;
      width: auto;
      mix-blend-mode: screen; /* makes black background transparent */
      display: block;
    }

    /* Fallback if image missing */
    .logo-fallback {
      display: none;
      align-items: center;
      gap: .8rem;
    }
    .logo-fallback.show { display: flex; }
    .logo-mark-fb {
      width: 42px; height: 42px;
      border-radius: 13px;
      background: var(--dark);
      display: grid; place-items: center;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(41,189,224,.28);
    }
    .logo-mark-fb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-text-fb {
      font-size: 1.28rem; font-weight: 900; letter-spacing: -.03em;
      background: linear-gradient(90deg, #fff, #A8E9F7 60%, var(--accent-soft));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header-actions { display: flex; align-items: center; gap: .75rem; }

    .header-badge, .mini-cta {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-weight: 800;
      font-size: .78rem;
      white-space: nowrap;
      text-decoration: none;
    }

    .header-badge {
      padding: .45rem .9rem;
      background: rgba(41,189,224,.12);
      border: 1px solid rgba(41,189,224,.28);
      color: #A8E9F7;
    }

    .mini-cta {
      padding: .55rem 1rem;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 24px rgba(41,189,224,.28);
    }

    .page { max-width: 1160px; margin: 0 auto; padding: 0 1.25rem; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, .92fr);
      align-items: center;
      gap: 2rem;
      padding: 4.5rem 0 2.6rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.13);
      color: #A8E9F7;
      font-size: .8rem;
      font-weight: 800;
      padding: .45rem .9rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      color: #fff;
      font-family: 'Manrope', 'Noto Sans', system-ui, sans-serif;
      font-size: clamp(2rem, 4.6vw, 3.75rem);
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: -.035em;
      margin-bottom: 1.1rem;
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-copy {
      color: #A8D8E8;
      font-size: 1.02rem;
      line-height: 1.85;
      max-width: 680px;
      margin-bottom: 1.45rem;
    }

    .hero-buttons { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }

    .btn-primary, .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      border-radius: 14px;
      padding: .9rem 1.15rem;
      font-weight: 850;
      font-size: .94rem;
      text-decoration: none;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 14px 30px rgba(41,189,224,.36);
    }

    .btn-secondary {
      color: #D0F3FB;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
    }

    .hero-note { color: #7BC8DA; font-size: .84rem; margin-top: 1rem; line-height: 1.6; }

    /* Mascot */
    .hero-mascot-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: -1.5rem;
      z-index: 2;
      pointer-events: none;
    }
    .hero-mascot-wrap img {
      height: 210px;
      width: auto;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,.35));
      animation: mascot-float 4s ease-in-out infinite;
    }
    @keyframes mascot-float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .hero-panel {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      padding: 1.1rem;
      box-shadow: var(--shadow);
    }

    .merchant-card {
      background: rgba(255,255,255,.97);
      border-radius: 22px;
      padding: 1.35rem;
      overflow: hidden;
    }

    .merchant-card-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }

    .merchant-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--soft);
      color: var(--primary-dark);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .4rem .75rem;
      font-size: .76rem;
      font-weight: 850;
    }

    .approval { color: var(--success); font-size: .78rem; font-weight: 850; }

    .sample-product {
      background: linear-gradient(135deg, #EBF8FC, #FFFFFF);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .sample-product h3 { font-size: 1rem; color: #060C24; margin-bottom: .45rem; }
    .sample-product p { color: var(--muted); font-size: .84rem; line-height: 1.65; }

    .amount-row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: .9rem; }

    .amount-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .85rem;
    }

    .amount-box small { display: block; color: var(--muted); font-size: .7rem; margin-bottom: .25rem; }
    .amount-box strong { color: var(--primary-dark); font-size: 1rem; }

    .ref-preview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: #060C24;
      color: #fff;
      border-radius: 18px;
      padding: 1rem;
      margin-top: 1rem;
    }

    .ref-preview small { display: block; color: #7ED4EA; font-size: .72rem; margin-bottom: .28rem; }
    .ref-preview strong { font-size: 1.15rem; letter-spacing: .08em; }
    .bonus-badge { background: rgba(16,185,129,.16); color: #A7F3D0; border: 1px solid rgba(16,185,129,.28); border-radius: 999px; padding: .35rem .7rem; font-size: .74rem; font-weight: 850; white-space: nowrap; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: .7rem 0 2.7rem;
    }

    .stat-card {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 20px;
      padding: 1.15rem;
      color: #fff;
      min-height: 118px;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(92,212,238,.38);
      box-shadow: 0 18px 42px rgba(0,0,0,.22);
    }

    .stat-card strong { display: block; font-size: clamp(1.7rem, 4vw, 2.35rem); font-weight: 900; letter-spacing: -.04em; margin-bottom: .25rem; color: #fff; }
    .stat-card span { color: #C8B7E8; font-size: .9rem; line-height: 1.55; }
    .stat-card > span { display: block; }
    .stat-card.boost {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(41,189,224,.18));
      border-color: rgba(92,212,238,.28);
    }
    .stat-card.boost::after {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      right: -42px; top: -44px;
      border-radius: 50%;
      background: rgba(16,185,129,.20);
    }
    .stat-icon {
      position: relative;
      z-index: 1;
      display: inline-grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: 14px;
      background: rgba(16,185,129,.18);
      border: 1px solid rgba(16,185,129,.30);
      margin-bottom: 0;
      font-size: 1.25rem;
    }
    .boost-number { position: relative; z-index: 1; display: flex; align-items: center; gap: .7rem; margin-bottom: .42rem; width: 100%; }
    .boost-number strong { margin-bottom: 0; line-height: 1; }
    .stat-card.boost > span { padding-left: 0; margin-top: .15rem; }
    .stat-card.boost strong, .stat-card.boost span { position: relative; z-index: 1; }

    .ref-tools-grid {
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .bonus-table-box {
      margin-top: 1rem;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, #FFFFFF, var(--soft));
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: var(--shadow-soft);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .bonus-table-box:hover {
      transform: translateY(-3px);
      border-color: rgba(108,43,217,.32);
      box-shadow: 0 18px 40px rgba(41,189,224,.14);
    }
    .bonus-table-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
    }
    .bonus-table-box h3 { font-size: 1.02rem; color: #060C24; margin-bottom: .35rem; }
    .bonus-table-box p { color: var(--muted); font-size: .86rem; line-height: 1.6; }
    .bonus-table-head.compact { align-items: flex-start; }
    .code-check-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .75rem;
      margin-top: 1rem;
    }
    .code-check-row input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: .86rem .95rem;
      font-family: inherit;
      font-size: .9rem;
      outline: none;
      background: #fff;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .code-check-row input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(41,189,224,.15);
    }
    .lookup-result {
      display: none;
      margin-top: .9rem;
      background: #060C24;
      color: #fff;
      border-radius: 16px;
      padding: .9rem 1rem;
      border: 1px solid rgba(41,189,224,.22);
    }
    .lookup-result.show { display: block; }
    .lookup-result small { display: block; color: #7ED4EA; font-size: .75rem; margin-bottom: .25rem; }
    .lookup-result strong { font-size: 1.35rem; letter-spacing: .12em; color: #fff; }
    .bonus-updated {
      background: var(--soft);
      border: 1px solid var(--line);
      color: #0A2A3A;
      border-radius: 12px;
      padding: .7rem .85rem;
      font-size: .84rem;
      margin-bottom: .8rem;
    }

    .btn-check-code {
      border: none;
      border-radius: 12px;
      padding: .88rem 1.05rem;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-family: inherit;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 10px 24px rgba(41,189,224,.25);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn-check-code:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(108,43,217,.34); }
    .bonus-table-wrap { display: none; margin-top: 1rem; }
    .bonus-table-wrap.show { display: block; }
    .bonus-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .bonus-table th, .bonus-table td {
      text-align: left;
      padding: .85rem .95rem;
      border-bottom: 1px solid var(--line);
      font-size: .9rem;
    }
    .bonus-table th {
      background: #060C24;
      color: #fff;
      font-weight: 850;
    }
    .bonus-table td:first-child { color: var(--primary-dark); font-weight: 900; letter-spacing: .08em; }
    .bonus-table td:last-child { color: var(--success); font-weight: 900; }
    .bonus-table tr:last-child td { border-bottom: none; }
    .bonus-table tbody tr { transition: background .18s ease, transform .18s ease; }
    .bonus-table tbody tr:hover { background: var(--soft); }
    .bonus-note { margin-top: .7rem; font-size: .78rem !important; color: var(--muted); }

    .section { margin: 0 0 2rem; }

    .white-section {
      background: #fff;
      border-radius: 28px;
      padding: 2rem;
      box-shadow: var(--shadow-soft);
    }

    .section-title {
      max-width: 760px;
      margin-bottom: 1.4rem;
    }

    .section-title .kicker {
      color: var(--primary);
      font-weight: 900;
      font-size: .78rem;
      margin-bottom: .45rem;
    }

    .section-title h2 { font-size: clamp(1.45rem, 3vw, 2.1rem); letter-spacing: -.04em; color: #060C24; margin-bottom: .5rem; }
    .section-title p { color: var(--muted); line-height: 1.7; font-size: .96rem; }

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .benefit-card {
      border: 1px solid var(--line);
      background: var(--soft-2);
      border-radius: 18px;
      padding: 1.1rem;
      min-height: 178px;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
    }
    .benefit-card:hover {
      transform: translateY(-4px);
      background: #fff;
      border-color: rgba(41,189,224,.28);
      box-shadow: 0 16px 34px rgba(41,189,224,.10);
    }

    .benefit-icon { font-size: 1.45rem; margin-bottom: .75rem; }
    .benefit-card h3 { font-size: .98rem; color: #060C24; margin-bottom: .45rem; }
    .benefit-card p { color: var(--muted); font-size: .86rem; line-height: 1.65; }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .process-card {
      position: relative;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--soft), #fff);
      border: 1px solid var(--line);
      padding: 1.15rem;
      min-height: 155px;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .process-card:hover {
      transform: translateY(-4px);
      border-color: rgba(41,189,224,.28);
      box-shadow: 0 16px 34px rgba(41,189,224,.10);
    }

    .process-num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-weight: 900;
      margin-bottom: .75rem;
    }

    .process-card h3 { font-size: .98rem; margin-bottom: .42rem; color: #060C24; }
    .process-card p { color: var(--muted); font-size: .84rem; line-height: 1.6; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .8rem;
    }

    .category-item {
      display: flex;
      gap: .55rem;
      align-items: flex-start;
      background: var(--soft-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .8rem;
      color: #0A2A3A;
      font-size: .86rem;
      line-height: 1.45;
      font-weight: 650;
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .category-item:hover {
      transform: translateY(-3px);
      background: #fff;
      border-color: rgba(108,43,217,.26);
      box-shadow: 0 12px 28px rgba(41,189,224,.12);
    }

    .category-item span { color: var(--success); font-weight: 900; }

    .form-wrapper { margin: 0 auto 3rem; }

    .form-card {
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(168,85,247,.16);
    }

    .form-top {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 1.7rem;
      background: linear-gradient(135deg, var(--soft), #fff);
      border-bottom: 1px solid var(--line);
    }

    .form-top h2 { font-size: 1.25rem; color: #060C24; letter-spacing: -.03em; margin-bottom: .22rem; }
    .form-top p { color: var(--muted); font-size: .88rem; line-height: 1.6; }

    .form-pill { background: #fff; border: 1px solid var(--line); color: var(--primary-dark); padding: .55rem .85rem; border-radius: 999px; font-size: .78rem; font-weight: 850; white-space: nowrap; }

    .section-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1.45rem 1.8rem 1.05rem;
      border-bottom: 1px solid var(--line);
    }

    .section-icon {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      background: var(--soft);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      flex: 0 0 auto;
    }

    .section-header h2 { font-size: 1rem; font-weight: 850; color: var(--text); }
    .section-header p { font-size: .8rem; color: var(--muted); margin-top: .15rem; line-height: 1.45; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem;
      padding: 1.55rem 1.8rem;
    }

    .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-grid.single { grid-template-columns: 1fr; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }

    .section-divider { height: 8px; background: #F0FAFD; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

    .field { display: flex; flex-direction: column; gap: .42rem; }
    .field label { font-size: .78rem; font-weight: 760; color: #1A5068; line-height: 1.45; }
    .field label .req { color: var(--error); margin-left: 2px; }
    .field label small { color: var(--muted); font-weight: 500; }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: .78rem .95rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--text);
      background: #FDFBFF;
      transition: border-color .2s, box-shadow .2s, background .2s;
      outline: none;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(41,189,224,.15);
      background: #fff;
    }

    .field input::placeholder, .field textarea::placeholder { color: #9DD4E4; }
    .field select { cursor: pointer; }
    .field textarea { resize: vertical; min-height: 92px; }
    .field .hint { font-size: .73rem; color: var(--muted); line-height: 1.5; }

    .invite-wrap { position: relative; }
    .invite-wrap .ticket {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }
    .invite-wrap input { padding-left: 2.45rem; letter-spacing: .16em; font-weight: 800; }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 1.55rem 1.8rem;
    }

    .upload-card {
      border: 1.5px dashed var(--line);
      border-radius: 16px;
      padding: 1.15rem .9rem;
      text-align: center;
      cursor: pointer;
      transition: all .25s;
      background: #FDFBFF;
      position: relative;
