<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хуудас олдсонгүй · WoowPay мерчант газрын зураг</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--navy:#030132;--cyan:#33A8DD;--cyan-dark:#0B6BFF;--orange:#F2A93B;--ink:#10213F;--gray:#566275;--line:#E6EBF2;--alt:#F5F7FA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--alt);color:var(--ink);font:16px/1.55 Rubik,"Noto Sans",system-ui,Arial,sans-serif}
header{background:#273270;border-bottom:1px solid rgba(255,255,255,.08)}
.logo img{height:32px;width:auto;display:block}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
header .wrap{height:64px;display:flex;align-items:center}
.wordmark{display:inline-flex;align-items:baseline;gap:2px;font-weight:700;font-size:24px;line-height:1;letter-spacing:-.03em;color:var(--cyan-dark);text-decoration:none}
.wordmark i{font-style:normal;color:var(--navy)}
.wordmark sup{font-size:11px;color:var(--cyan);font-weight:500;top:-.9em}
main{flex:1;display:grid;place-items:center;padding-block:48px}
.card{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.owl{width:180px;height:auto}
.code{font-family:Montserrat,Rubik,sans-serif;font-weight:700;font-size:72px;line-height:1;letter-spacing:-.04em;color:var(--cyan-dark)}
.code span{color:var(--orange)}
h1{font-size:28px;margin:0;text-wrap:balance}
p{margin:0;color:var(--gray)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:12px;font-weight:500;text-decoration:none}
.primary{background:#273270;color:#fff}
.line{border:1px solid #D3DBE6;color:var(--ink);background:#fff}
a:focus-visible{outline:2px solid var(--cyan-dark);outline-offset:2px}
footer{padding-block:20px;font-size:14px;color:var(--gray)}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/map/" aria-label="Woow Pay"><img src="/map/assets/woow-logo.png" alt="Woow Pay" width="152" height="32"></a></div></header>
<main>
  <div class="card wrap">
    <img class="owl" src="/map/assets/owl.webp" alt="" width="180" height="141" onerror="this.remove()">
    <div class="code" aria-hidden="true">404<span>.</span></div>
    <h1>Энэ хуудас олдсонгүй</h1>
    <p>Холбоос хуучирсан эсвэл мерчант жагсаалтаас хасагдсан байж магадгүй. Ойролцоох газраа газрын зургаас олоорой.</p>
    <div class="acts">
      <a class="btn primary" href="/map/">Газрын зураг руу буцах</a>
      <a class="btn line" href="https://m.me/woowpay" rel="noopener">Асуулт асуух</a>
    </div>
  </div>
</main>
<footer><div class="wrap">© 2026 Woow Pay · Лавлах <a href="tel:+97672726565" style="color:inherit">7272-6565</a></div></footer>
</body>
</html>
